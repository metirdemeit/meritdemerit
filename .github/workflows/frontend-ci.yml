name: Frontend CI

on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (errors only)
        run: npx eslint src --quiet
      - run: npm run build
