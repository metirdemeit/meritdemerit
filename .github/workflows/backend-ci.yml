name: Backend CI

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # same minor as Render (.python-version pins 3.11.9)
          cache: pip
      - run: pip install -r requirements.txt ruff==0.14.0
      - name: Lint (real errors only)
        run: ruff check --isolated --select F,E9 backend bot migrations tests
      - name: Tests
        run: pytest -q
