name: Backend CI

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt ruff==0.14.0
      - name: Lint (real errors only)
        run: ruff check --isolated --select F,E9 backend bot migrations tests
      - name: Tests
        run: pytest -q
