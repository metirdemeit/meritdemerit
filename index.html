<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#0C0B21"/>
    <meta name="color-scheme" content="dark"/>
    <title>Merits &amp; Demerits</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /*
       * Safe areas shared by every page.
       * - Telegram (Bot API 8+) sets --tg-safe-area-inset-* (notch / home indicator)
       *   and --tg-content-safe-area-inset-* (its own header buttons in fullscreen).
       * - In a regular browser those are missing and env() from the OS is used.
       */
      :root {
        --app-safe-top: calc(
          var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) +
          var(--tg-content-safe-area-inset-top, 0px) + 16px
        );
        --app-safe-bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        --app-nav-height: 64px;
      }
      html, body { margin: 0; background: #0C0B21; color: #fff; }
      body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/index.jsx" type="module"></script>
  </body>
</html>
